schema_version: root-sequence-project-registry/v1
visibility: public-safe
canonical_ecosystem_map: https://github.com/Root-Sequence/root-sequence/blob/main/ECOSYSTEM.md
wiki_project_index: https://github.com/Root-Sequence/wiki/blob/main/PROJECTS.md
documentation_standard: DOCUMENTATION_SYSTEM.md

relationship_types:
  broader-context: supplies a wider conceptual frame
  focused-inquiry: develops one narrower question
  grounds: contributes lived, ethical, or evidentiary constraints
  tests: examines ideas under practical or simulated conditions
  informs: supplies lessons without controlling the target
  indexes: makes another project's identity or work findable
  discussion-hub: hosts cross-project conversation before routing
  private-overlay: privately extends a public knowledge layer
  world-design: develops speculative systems and institutions
  narrative-expression: explores a world or question through story
  organization-infrastructure: supplies shared maintenance or contribution machinery

